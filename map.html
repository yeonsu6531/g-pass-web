<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>G-Pass 울산 - 지도</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="top-bar">
    <button onclick="location.href='index.html'" style="padding:10px 14px">🏠</button>
    <details id="station-details">
      <summary>🚏 정류장 보기</summary>
      <div id="station-menu">
        <button class="cat-btn" id="btn-cat-citytour" onclick="toggleCategory('citytour')">🚌 시티투어</button>
        <button class="cat-btn" id="btn-cat-tourist" onclick="toggleCategory('tourist')">📍 관광지투어</button>
      </div>
    </details>
    <button id="btn-route" onclick="showRoutePanel()">🗺 경로 설정</button>
  </div>

  <div id="map"></div>

  <div id="route-panel" class="hidden">
    <div id="panel-header">
      <span>경로 설정</span>
      <button onclick="closeRoutePanel()">✕</button>
    </div>
    <div class="input-row">
      <span class="label">출발</span>
      <input type="text" id="input-origin" value="현재 위치" readonly>
      <button onclick="useCurrentLocation()">📍</button>
    </div>
    <div class="input-row">
      <span class="label">도착</span>
      <input type="text" id="input-dest" placeholder="목적지 검색">
      <button onclick="searchDest()">🔍</button>
    </div>
    <ul id="search-results"></ul>
    <div id="route-results" class="hidden"></div>
  </div>

  <div id="detail-panel" class="hidden">
    <div id="panel-header">
      <button onclick="backToRoutes()">← 뒤로</button>
      <span id="detail-title">경로 상세</span>
    </div>
    <div id="detail-content"></div>
  </div>

  <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=a0708e9c7e7833093e59a91049ff3288&libraries=services"></script>
  <script src="stations.js"></script>
  <script src="map.js"></script>
  <script src="search.js"></script>
  <script src="bus.js"></script>
  <script src="route.js"></script>
  <script src="ui.js"></script>

  <script>
    document.querySelectorAll('.cat-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        document.getElementById('station-details').removeAttribute('open');
      });
    });
    document.addEventListener('click', function(e) {
      var details = document.getElementById('station-details');
      if (!details.contains(e.target)) {
        details.removeAttribute('open');
      }
    });
  </script>
</body>
</html>
