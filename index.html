<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>G-Pass 울산</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="top-bar">
    <div id="station-dropdown">
      <button id="btn-stations-main">🚏 정류장 보기 ▾</button>
      <div id="station-menu" class="hidden">
        <button class="cat-btn" id="btn-cat-ktx">🚆 KTX 울산역</button>
        <button class="cat-btn" id="btn-cat-citytour">🚌 시티투어</button>
        <button class="cat-btn" id="btn-cat-tourist">📍 관광지 인근</button>
      </div>
    </div>
    <button id="btn-route" onclick="showRoutePanel()">🗺 경로 설정</button>
  </div>

  <div id="map"></div>

  <div id="route-panel" class="hidden">
    <div id="panel-header">
      <span>경로 설정</span>
      <button onclick="closeRoutePanel()">✕</button>
    </div>
    <div class="input-row">
      <span class="label">출발</span>
      <input type="text" id="input-origin" value="현재 위치" readonly>
      <button onclick="useCurrentLocation()">📍</button>
    </div>
    <div class="input-row">
      <span class="label">도착</span>
      <input type="text" id="input-dest" placeholder="목적지 검색">
      <button onclick="searchDest()">🔍</button>
    </div>
    <ul id="search-results"></ul>
    <div id="route-results" class="hidden"></div>
  </div>

  <div id="detail-panel" class="hidden">
    <div id="panel-header">
      <button onclick="backToRoutes()">← 뒤로</button>
      <span id="detail-title">경로 상세</span>
    </div>
    <div id="detail-content"></div>
  </div>

  <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=a0708e9c7e7833093e59a91049ff3288&libraries=services"></script>
  <script src="stations.js"></script>
  <script src="map.js"></script>
  <script src="search.js"></script>
  <script src="bus.js"></script>
  <script src="route.js"></script>
  <script src="ui.js"></script>

  <script>
    // 드롭다운 - onclick 대신 addEventListener로 완전히 분리
    var mainBtn = document.getElementById('btn-stations-main');
    var menu = document.getElementById('station-menu');

    mainBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      menu.classList.toggle('hidden');
    });

    document.getElementById('btn-cat-ktx').addEventListener('click', function(e) {
      e.stopPropagation();
      menu.classList.add('hidden');
      toggleCategory('ktx');
    });

    document.getElementById('btn-cat-citytour').addEventListener('click', function(e) {
      e.stopPropagation();
      menu.classList.add('hidden');
      toggleCategory('citytour');
    });

    document.getElementById('btn-cat-tourist').addEventListener('click', function(e) {
      e.stopPropagation();
      menu.classList.add('hidden');
      toggleCategory('tourist');
    });

    document.body.addEventListener('click', function() {
      menu.classList.add('hidden');
    });
  </script>
</body>
</html>
